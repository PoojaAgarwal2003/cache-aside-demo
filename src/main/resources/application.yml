server:
  address: 127.0.0.1
  port: ${APP_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    threads:
      max: 64
      min-spare: 4
    max-connections: 128
    accept-count: 64
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: cache-aside-demo
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:55432}/flashsale_lab?currentSchema=lab&connectTimeout=3&socketTimeout=15
    username: flashsale
    password: ${DB_PASSWORD:local-lab-only}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET statement_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: lab
  flyway:
    default-schema: lab
    schemas: lab
    clean-disabled: true
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:56379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      use-big-decimal-for-floats: true
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    multipart:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

lab:
  demo-enabled: false
  read-delay-ms: 0
  purchase-delay-ms: 0
